name: Fork ai-proj policy

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review, review_requested]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Open PR number to validate using trusted default-branch policy
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: fork-ai-proj-${{ github.event.pull_request.number || inputs.pull_request_number }}
  cancel-in-progress: false

jobs:
  policy:
    name: Fork ai-proj validation
    if: github.repository == 'qiudl/deepseek-harness'
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Use Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Validate approved Requirement and linked implementation task
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AI_PROJ_CI_READ_TOKEN: ${{ secrets.AI_PROJ_CI_READ_TOKEN }}
        run: node .github/issue-management/ai-proj.mjs
