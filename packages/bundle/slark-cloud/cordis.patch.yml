# Slark cloud Runtime Cells apply this after dsh-base and dsh-web-app. The
# feature switch removes remote execution without restoring any cell-local
# execution provider.

- id: subprocess
  disabled: true

- id: sandbox
  disabled: true

- id: bash-sandbox
  disabled: true

- id: pwsh-sandbox
  disabled: true

- id: fs-sandbox
  disabled: true

# A cloud Cell persists provider keys under its per-user DSH_HOME, but the
# document is ciphertext. The key path points at a systemd credential outside
# that home; either missing deployment input resolves to a guaranteed-missing
# absolute path, so the credential provider fails closed during activation.
- id: credentials
  config:
    path: !!js process.env.DSH_HOME && process.env.DSH_HOME + '/.credentials.enc' || '/__missing_dsh_home__/.credentials.enc'
    encryptionKeyFile: !!js process.env.DSH_CREDENTIALS_KEY_FILE || '/__missing_dsh_credentials_key__'

- id: directory-picker
  disabled: true

- id: plugin-inventory
  disabled: true

- id: cordis-host-runner
  disabled: true

- id: cordis-client-runner
  disabled: true

- id: ui-settings-plugin-inventory
  disabled: true

- id: ui-cordis
  disabled: true

- id: ui-agent-preset
  disabled: true

- id: ui-settings-plugins
  disabled: true

# The permission preset service requires Shell. Keep its host and browser
# halves aligned with the only cloud profile that mounts remote Shell.
- id: permission
  disabled: !!js process.env.DSH_SLARK_REMOTE_PROVIDER_V1 !== '1' || process.env.WEB_DSH_LOCAL_COMPUTER_V1 === '1'

- id: ui-permission
  disabled: !!js process.env.DSH_SLARK_REMOTE_PROVIDER_V1 !== '1' || process.env.WEB_DSH_LOCAL_COMPUTER_V1 === '1'

- id: agent-presets
  config:
    default: slark-cloud
    includeUserRoot: false

- insert:
    - id: slark-cloud-ingress
      name: '@deepseek-ai/dsh-slark-cloud'
      disabled: !!js "process.env.WEB_DSH_LOCAL_COMPUTER_V1 !== undefined && process.env.WEB_DSH_LOCAL_COMPUTER_V1 !== '0' && process.env.WEB_DSH_LOCAL_COMPUTER_V1 !== '1' ? (() => { throw new Error('WEB_DSH_LOCAL_COMPUTER_V1 must be exactly 0 or 1') })() : process.env.DSH_SLARK_REMOTE_PROVIDER_V1 !== '1'"

    - id: slark-device
      name: '@deepseek-ai/dsh-slark-device-client'
      disabled: !!js process.env.DSH_SLARK_REMOTE_PROVIDER_V1 !== '1'
      config:
        gatewayUrl: !!js process.env.SLARK_DSH_GATEWAY_URL
        # Cell and Slark Server share the Docker-internal dsh-control network.
        # Standalone profiles retain the client's HTTPS-only default.
        allowInsecureHttp: true

    - id: slark-identity
      name: '@deepseek-ai/dsh-slark-identity'
      disabled: !!js process.env.DSH_SLARK_REMOTE_PROVIDER_V1 !== '1'
      config:
        callerProfile: !!js "process.env.WEB_DSH_LOCAL_COMPUTER_V1 === '1' ? 'web_dsh_v1' : undefined"
        authorityDirectory: !!js process.env.SLARK_DSH_AUTHORITY_DIRECTORY
        workspaceRoot: !!js process.env.SLARK_DSH_WORKSPACE_ROOT
        expectedWorkspaceHandle: !!js process.env.SLARK_DSH_WORKSPACE_HANDLE
        environmentId: !!js process.env.SLARK_DSH_ENVIRONMENT_ID
        cellId: !!js process.env.SLARK_DSH_CELL_ID
        refreshUrl: !!js process.env.SLARK_DSH_EDGE_REFRESH_URL

    - id: slark-collaboration-network
      name: '@deepseek-ai/dsh-slark-collaboration-network'
      disabled: !!js process.env.DSH_SLARK_COLLABORATION_V2 !== '1'
      config:
        enabled: true
        gatewayUrl: !!js process.env.SLARK_DSH_GATEWAY_URL
        allowInsecureHttp: true
        workspaceRoot: !!js process.env.SLARK_DSH_WORKSPACE_ROOT
        workspaceHandle: !!js process.env.SLARK_DSH_WORKSPACE_HANDLE
        workerId: !!js process.env.SLARK_DSH_WORKER_ID
        formalAgents: !!js JSON.parse(process.env.SLARK_DSH_FORMAL_AGENTS || '[]')

    - id: slark-fs
      name: '@deepseek-ai/dsh-fs-slark-remote'
      disabled: !!js process.env.DSH_SLARK_REMOTE_PROVIDER_V1 !== '1'
      config:
        callerProfile: !!js "process.env.WEB_DSH_LOCAL_COMPUTER_V1 === '1' ? 'web_dsh_v1' : undefined"
        workspaceHandle: !!js process.env.SLARK_DSH_WORKSPACE_HANDLE

    - id: slark-local-computer-ui
      name: '@deepseek-ai/dsh-client-ui-slark-local-computer'
      disabled: !!js process.env.DSH_SLARK_REMOTE_PROVIDER_V1 !== '1' || process.env.WEB_DSH_LOCAL_COMPUTER_V1 !== '1'

    # M1 plugin discovery remains dynamically composable: each face is an
    # ordinary Cordis entry rather than behavior embedded in the Web shell.
    - id: plugin-catalog
      name: '@deepseek-ai/dsh-plugin-catalog-file'
      config:
        manifestPath: !!js process.env.DSH_PLUGIN_CATALOG_MANIFEST || '/var/lib/dsh/plugin-catalog/manifest.json'

    - id: plugin-catalog-gateway
      name: '@deepseek-ai/dsh-host-plugin-catalog-gateway'

    - id: tool-plugin-catalog
      name: '@deepseek-ai/dsh-tool-plugin-catalog'

    - id: ui-settings-plugin-market
      name: '@deepseek-ai/dsh-client-ui-settings-plugin-market'

    # Preserve the reviewed v1 Shell surface until the independent Web local-
    # computer rollout is enabled. The v2 Web profile is deliberately file-only.
    - id: slark-shell
      name: '@deepseek-ai/dsh-shell-slark-remote'
      disabled: !!js process.env.DSH_SLARK_REMOTE_PROVIDER_V1 !== '1' || process.env.WEB_DSH_LOCAL_COMPUTER_V1 === '1'
      config:
        workspaceHandle: !!js process.env.SLARK_DSH_WORKSPACE_HANDLE
